<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-Based Bulk Fruit Detection</title>
<style>
:root{--bg:#fff;--fg:#2b4a63;--accent:#3a5f7d;--soft:#eef2f6;--line:#d5dde5}
@media (prefers-color-scheme:dark){:root{--bg:#121a21;--fg:#d8e3ec;--accent:#7fa8c9;--soft:#1b2630;--line:#2c3b48}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
header{background:var(--accent);color:#fff;text-align:center;padding:48px 16px}
header h1{margin:0;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:1px}
main{max-width:960px;margin:0 auto;padding:24px 16px}
h2{color:var(--accent);border-bottom:2px solid var(--line);padding-bottom:6px}
.card{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:20px}
.hint{margin:0 0 14px;font-size:.95rem;opacity:.85}
button,input[type=file]{font:inherit}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
button:disabled{opacity:.5}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
canvas{max-width:100%;height:auto;margin-top:16px;border-radius:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:#2f9e44;color:#fff;border-radius:999px;padding:4px 14px}
.chip.bad{background:#e03131}
.total{font-size:1.4rem;font-weight:700;margin-top:12px}
#status{margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>AI-Based Bulk Fruit Detection</h1>
</header>
<main>
  <h2>Live Demo</h2>
  <div class="card">
    <p class="hint">Detects: Apple, Orange, Banana, Pineapple, Watermelon. Damaged fruits are marked in red. Use a clear, well-lit photo.</p>
    <div class="row">
      <input type="file" id="file" accept="image/*">
      <button id="go" disabled>Detect &amp; Count</button>
    </div>
    <div id="status"></div>
    <canvas id="cv" hidden></canvas>
    <div class="total" id="total"></div>
    <div class="chips" id="chips"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const file = $("file"), go = $("go"), cv = $("cv"), ctx = cv.getContext("2d");
let img = null;

file.onchange = () => {
  const f = file.files[0];
  if (!f) return;
  img = new Image();
  img.onload = () => {
    cv.width = img.width; cv.height = img.height;
    ctx.drawImage(img, 0, 0); cv.hidden = false;
    go.disabled = false;
    $("total").textContent = ""; $("chips").innerHTML = ""; $("status").textContent = "";
  };
  img.src = URL.createObjectURL(f);
};

go.onclick = async () => {
  go.disabled = true;
  $("status").textContent = "Detecting… this can take up to 1-2 minutes. Please wait.";
  try {
    const fd = new FormData(); fd.append("image", file.files[0]);
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 200000);
    let res;
    try { res = await fetch("/api/detect", { method: "POST", body: fd, signal: ctrl.signal }); }
    catch { throw new Error("The server took too long. Please try again with a smaller image."); }
    finally { clearTimeout(timer); }
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error("The server is waking up. Please wait 30 seconds and press Detect again."); }
    if (!res.ok) throw new Error(data.error || "Please try again.");

    const preds = data.predictions || [];
    const sx = data.width ? img.width / data.width : 1;
    const sy = data.height ? img.height / data.height : 1;
    ctx.drawImage(img, 0, 0);
    const counts = {};
    const lw = Math.max(2, img.width / 300);
    preds.forEach(p => {
      counts[p.class] = (counts[p.class] || 0) + 1;
      const w = p.width * sx, h = p.height * sy;
      const x = p.x * sx - w / 2, y = p.y * sy - h / 2;
      const bad = p.class.startsWith("Damaged");
      const col = bad ? "#e03131" : "#2f9e44";
      ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = col; ctx.font = `${lw * 6}px sans-serif`;
      ctx.fillText(p.class, x + 2, Math.max(lw * 6, y - 4));
    });
    const dmg = preds.filter(p => p.class.startsWith("Damaged")).length;
    $("total").textContent = `Total: ${preds.length} | Fresh: ${preds.length - dmg} | Damaged: ${dmg}`;
    $("chips").innerHTML = Object.entries(counts)
      .map(([k, v]) => `<span class="chip${k.startsWith("Damaged") ? " bad" : ""}">${k}: ${v}</span>`).join("");
    $("status").textContent = preds.length ? "" :
      "No fruits detected. Try a clear photo of an apple, orange, banana, pineapple or watermelon.";
  } catch (e) {
    $("status").textContent = e.message;
  } finally { go.disabled = false; }
};
</script>
</body>
</html>
